name: Bug report
description: Report something that does not work as documented
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Fill in what you can; the reproduction steps matter most.
        For security issues, do not use this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: The retry endpoint returned 500 when I retried a failed job.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, requests, or clicks, in order.
      placeholder: |
        1. docker compose up --build
        2. curl -X POST http://localhost:8000/api/jobs -H 'Content-Type: application/json' -d '{...}'
        3. ...
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: API response or log output
      description: Paste the full response body, error message, or relevant log lines.
      placeholder: |
        {"message": "..."}
      render: shell
  - type: input
    id: setup
    attributes:
      label: Setup
      description: How are you running it? Include PHP and Node.js versions.
      placeholder: Docker Compose, PHP 8.3, Node.js 24
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the README "What was verified / not verified" section
          required: false
        - label: I am running the code on main, not an old release
          required: false
