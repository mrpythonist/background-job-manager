services:
  postgres:
    image: postgres:16-alpine
    container_name: bjm-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-background_jobs}
      POSTGRES_USER: ${DB_USERNAME:-bjm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bjm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bjm} -d ${DB_DATABASE:-background_jobs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bjm-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - bjm-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: bjm-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-background_jobs}
      DB_USERNAME: ${DB_USERNAME:-bjm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      JOB_MANAGER_API_KEY: ${JOB_MANAGER_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  worker:
    build:
      context: ./backend
    container_name: bjm-worker
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-background_jobs}
      DB_USERNAME: ${DB_USERNAME:-bjm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "redis", "--queue=default,emails,reports,images,sync", "--tries=3", "--sleep=3"]

  frontend:
    build:
      context: ./frontend
    container_name: bjm-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  bjm-postgres:
  bjm-redis:
